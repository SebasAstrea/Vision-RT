name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ runner.temp }}/android-sdk
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "platform-tools" >/dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew lintDebug --stacktrace
      - name: Detekt
        run: ./gradlew detekt --stacktrace
      - name: Package size report
        run: bash tools/scripts/package_size_report.sh
      - name: Accessibility scan placeholder
        run: bash tools/scripts/accessibility_scan.sh