name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME=/tmp/android-sdk
          export ANDROID_SDK_ROOT=/tmp/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0" \
            "build-tools;36.0.0" "platform-tools" >/dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_HOME=/tmp/android-sdk" >> "$GITHUB_ENV"
      - name: Build (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew lintDebug --stacktrace
      - name: Detekt
        run: ./gradlew detekt --stacktrace
      - name: Package size report
        run: bash tools/scripts/package_size_report.sh

  instrumentation:
    # API 30 (minSdk) x86_64 boots reliably in software emulation on the
    # KVM-less ubuntu-latest runners; higher API levels time out. macOS runners
    # have the required acceleration but queue for a long time.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME=/tmp/android-sdk
          export ANDROID_SDK_ROOT=/tmp/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" \
            "system-images;android-30;google_apis;x86_64" >/dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_HOME=/tmp/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/tmp/android-sdk" >> "$GITHUB_ENV"
      - name: Accessibility scan (instrumented AccessibilityChecks)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/scripts/accessibility_scan.sh